[project]
name = "gta-media-engine"
version = "0.1.0"
description = "Autonomous GTA VI short-form media production and distribution engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "packaging>=23",
    "cryptography>=42",
    "feedparser>=6.0",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905", "B007", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real video with ffmpeg"]
